[package]
name = "ErdtreeLauncher"
version = "2.2.1"
description = "FromSoft Mod Launcher / Manager"
authors = [ "Daniel2193" ]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "nuxtor_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2.4.1"
features = []

[dependencies]
tauri-plugin-shell = "2"
tauri-plugin-notification = "2.3.1"
tauri-plugin-os = "2.3.1"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde_json = "1"
tauri-plugin-pinia = "5"
tauri-plugin-upload = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
zip = "7"
sha2 = "*"
fs_extra = "1.3"
walkdir = "2"
tauri-plugin-devtools = "2"
tauri-plugin-process = "2"
hex = "0.4"

[dependencies.tauri]
version = "2.8.5"
features = [
  "tray-icon",
  "unstable"
]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[patch.crates-io]
tauri = { path = "../../tauri/crates/tauri" }
